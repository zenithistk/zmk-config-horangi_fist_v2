# 양쪽 반 공통 설정. 시프트 폴더의 .conf 보다 나중에 적용되어 우선합니다.

# 외부 전원 스위칭 미사용 (ZMK 기본값 y 를 끔)
CONFIG_ZMK_EXT_POWER=n

# BLE 연결 안정성: 2M PHY 를 끄고 1Mbps 로 고정.
# ZMK_BLE_EXPERIMENTAL_FEATURES 대신 연결 쪽만 명시적으로 선택하고,
# 패스키 입력은 유지하기 위해 따로 켭니다.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# 라디오 최대 출력
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 딥 슬립: 30분 무입력 시 sys_poweroff.
# 깨우려면 kscan 의 wakeup-source 가 필요합니다 (horangi_fist.dtsi).
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
